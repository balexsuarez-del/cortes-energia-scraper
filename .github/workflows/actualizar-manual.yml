name: Aplicar actualización manual de cortes

on:
  workflow_dispatch:
    inputs:
      eventos:
        description: 'JSON con la lista de eventos encontrados manualmente'
        required: true
        type: string

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Aplicar eventos
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          EVENTOS: ${{ github.event.inputs.eventos }}
        run: python scripts_aplicar_manual.py
